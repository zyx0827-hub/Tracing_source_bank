<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 · 角色分配</title>
    <!-- Font Awesome 5 (图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- 样式沿用上次风格，并增加角色对话框专属样式 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6fa;
            color: #1e293b;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            background: linear-gradient(145deg, #0f2b3d, #1b4a6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1 i {
            background: #1e3a5f;
            padding: 0.5rem;
            border-radius: 16px;
            color: white;
            font-size: 1.4rem;
            -webkit-text-fill-color: white;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            box-shadow: 0 8px 14px -6px rgba(37,99,235,0.3);
        }

        .btn-primary {
            background: #0f172a;
            color: white;
            border: none;
            padding: 0.75rem 1.8rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 16px -6px rgba(15,23,42,0.2);
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-primary:hover {
            background: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 14px 22px -8px #0f172a70;
        }

        .btn-secondary {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 500;
            transition: 0.15s;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .btn-secondary:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            box-shadow: 0 8px 12px -8px #94a3b8;
        }

        .btn-icon {
            background: transparent;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            transition: all 0.15s;
        }

        .btn-icon:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .btn-icon.danger:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        .filter-panel {
            background: white;
            border-radius: 28px;
            padding: 1rem 1.8rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem 2rem;
            box-shadow: 0 18px 30px -14px #b0c4db;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .search-wrapper {
            flex: 2;
            min-width: 260px;
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 40px;
            padding: 0.3rem 0.3rem 0.3rem 1.2rem;
            border: 1px solid #e2e8f0;
        }

        .search-wrapper i {
            color: #64748b;
        }

        .search-wrapper input {
            border: none;
            background: transparent;
            padding: 0.65rem 0.8rem;
            width: 100%;
            font-size: 0.95rem;
            outline: none;
        }

        .search-wrapper button {
            background: #0f172a;
            border: none;
            color: white;
            padding: 0.55rem 1.8rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }

        .order-control select {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            padding: 0.6rem 1.8rem 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%233b4b62" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat;
            background-position: right 1.2rem center;
        }

        .table-container {
            background: white;
            border-radius: 32px;
            padding: 1.5rem 1.2rem 1.8rem 1.2rem;
            box-shadow: 0 24px 44px -16px #94a3b866;
            border: 1px solid #ffffff50;
            margin-bottom: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 1rem 0.8rem;
            font-weight: 600;
            color: #475569;
            border-bottom: 1.5px solid #e9eef3;
            white-space: nowrap;
        }

        td {
            padding: 1rem 0.8rem;
            border-bottom: 1px solid #f1f5f9;
            color: #1e2b3c;
            vertical-align: middle;
        }

        tr:hover td {
            background-color: #fafdff;
        }

        .badge {
            background: #e9f2fa;
            color: #2563eb;
            font-weight: 600;
            font-size: 0.75rem;
            padding: 0.25rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
        }

        .action-group {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        /* 角色分配按钮特殊样式 */
        .role-badge-btn {
            background: #eaf5ff;
            border: 1px dashed #3b82f6;
            color: #1e4a7a;
            font-size: 0.75rem;
            border-radius: 30px;
            padding: 0.2rem 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            white-space: nowrap;
        }
        .role-badge-btn:hover {
            background: #dbeafe;
            border-style: solid;
        }

        /* 分页样式 */
        .pagination-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-top: 2rem;
            padding: 0 0.5rem;
        }
        .pagination-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .page-btn {
            width: 38px;
            height: 38px;
            border-radius: 14px;
            border: 1px solid #dee7ef;
            background: white;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
        }
        .page-btn.active {
            background: #1e293b;
            color: white;
            border-color: #1e293b;
        }
        .page-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* 模态框通用 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal-card {
            background: white;
            max-width: 520px;
            width: 90%;
            border-radius: 48px;
            padding: 2rem 2rem 1.8rem;
            box-shadow: 0 40px 70px -20px #1e293b;
            transform: scale(0.96);
            transition: 0.2s;
        }
        .modal-overlay.show .modal-card {
            transform: scale(1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 {
            font-weight: 700;
            font-size: 1.6rem;
            color: #0b1f33;
        }
        .close-icon {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: #94a3b8;
        }

        /* 角色列表区域 */
        .role-list {
            max-height: 320px;
            overflow-y: auto;
            margin: 1.2rem 0 1.8rem;
            border: 1px solid #edf2f7;
            border-radius: 28px;
            padding: 0.8rem 1rem;
            background: #f9fcff;
        }
        .role-item {
            display: flex;
            align-items: center;
            padding: 0.9rem 0.8rem;
            border-bottom: 1px solid #e9eff6;
            cursor: pointer;
            transition: 0.1s;
            border-radius: 20px;
        }
        .role-item:last-child {
            border-bottom: none;
        }
        .role-item:hover {
            background: #e5f0ff;
        }
        .role-item.selected {
            background: #d3e5ff;
            box-shadow: inset 0 0 0 2px #3b82f6;
        }
        .role-radio {
            margin-right: 1rem;
            accent-color: #2563eb;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .role-info {
            flex: 1;
        }
        .role-name {
            font-weight: 600;
            color: #0b2a44;
        }
        .role-desc {
            font-size: 0.8rem;
            color: #5f7d9c;
            margin-top: 4px;
        }

        .selected-hint {
            font-size: 0.85rem;
            background: #eaf5ff;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
            color: #1e4a7a;
        }

        .toast-tip {
            background: #1e293b;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 500;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 20px 30px -12px #0f172a;
            z-index: 1100;
            display: none;
            align-items: center;
            gap: 12px;
        }
        .toast-tip.show {
            display: flex;
        }
        .empty-row td {
            text-align: center;
            padding: 3rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- 头部 -->
    <div class="header">
        <h1><i class="fas fa-users-cog"></i> 用户管理 · 角色权限</h1>
        <button class="btn-primary" id="addUserBtn"><i class="fas fa-plus-circle"></i> 新增用户</button>
    </div>

    <!-- 搜索/排序栏 (与上一轮相同) -->
    <div class="filter-panel">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="搜索用户名、PID、邮箱..." value="">
            <button id="searchBtn"><i class="fas fa-arrow-right" style="margin-right: 6px;"></i> 搜索</button>
        </div>
        <div class="order-control">
            <i class="fas fa-sort-amount-down-alt" style="color: #62748c;"></i>
            <select id="orderingSelect">
                <option value="">默认排序</option>
                <option value="user_id">ID 升序</option>
                <option value="-user_id">ID 降序</option>
                <option value="user_name">用户名 A→Z</option>
                <option value="-user_name">用户名 Z→A</option>
            </select>
        </div>
    </div>

    <!-- 用户表格卡片 -->
    <div class="table-container">
        <table id="userTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>PID</th>
                    <th>邮箱</th>
                    <th>手机号</th>
                    <th>地址</th>
                    <th>角色</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr class="empty-row"><td colspan="8"><i class="fas fa-spinner fa-pulse"></i> 加载用户数据...</td></tr>
            </tbody>
        </table>

        <!-- 分页 -->
        <div class="pagination-bar">
            <span class="page-info" id="pageInfo"></span>
            <div class="pagination-controls" id="paginationControls">
                <button class="page-btn" id="prevPage" disabled><i class="fas fa-chevron-left"></i></button>
                <span id="pageNumbers" style="display: flex; gap: 5px;"></span>
                <button class="page-btn" id="nextPage" disabled><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- 新增/编辑用户模态框 (同上一轮) -->
<div class="modal-overlay" id="userModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle">添加用户</h3>
            <button class="close-icon" id="closeModalBtn">&times;</button>
        </div>
        <form id="userForm">
            <input type="hidden" id="userId" value="">
            <div class="form-row" style="margin-bottom: 1rem;">
                <label>用户名 *</label>
                <input type="text" class="field" id="userName" required>
            </div>
            <div class="form-row" style="margin-bottom: 1rem;">
                <label>PID</label>
                <input type="text" class="field" id="pid">
            </div>
            <div class="form-row" style="margin-bottom: 1rem;">
                <label>邮箱</label>
                <input type="email" class="field" id="email">
            </div>
            <div class="form-row" style="margin-bottom: 1rem;">
                <label>手机号</label>
                <input type="text" class="field" id="mobile">
            </div>
            <div class="form-row" style="margin-bottom: 1rem;">
                <label>地址</label>
                <input type="text" class="field" id="address">
            </div>
            <div class="form-row" style="margin-bottom: 1rem;">
                <label>密码 (仅编辑时如需修改)</label>
                <input type="password" class="field" id="password">
            </div>
            <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn-secondary" id="cancelModalBtn">取消</button>
                <button type="submit" class="btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 分配角色模态框 (新) 从 sys_rule 表获取角色数据，字段 role_id, role_name, description -->
<div class="modal-overlay" id="roleModal">
    <div class="modal-card" style="max-width: 550px;">
        <div class="modal-header">
            <h3><i class="fas fa-user-tag" style="margin-right: 10px;"></i>分配角色</h3>
            <button class="close-icon" id="closeRoleModalBtn">&times;</button>
        </div>
        <div style="padding: 0 0.5rem;">
            <p style="color: #2c3e4f; font-weight: 500;" id="roleModalUserName">为用户 <span style="background: #e2ecfe; padding:0.2rem 1rem; border-radius: 30px;">--</span> 选择角色</p>
        </div>
        <!-- 角色列表容器 动态从 sys_rule/ 加载 -->
        <div id="roleListContainer" class="role-list">
            <!-- 将动态渲染 role 项 -->
            <div style="text-align: center; padding: 2rem;"><i class="fas fa-spinner fa-pulse"></i> 加载角色列表...</div>
        </div>

        <!-- 已选角色提示 & 提交按钮 -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 1.2rem; flex-wrap: wrap;">
            <span id="selectedRoleHint" class="selected-hint"><i class="fas fa-info-circle"></i> 未选择角色</span>
            <div style="display: flex; gap: 12px;">
                <button class="btn-secondary" id="cancelRoleBtn">取消</button>
                <button class="btn-primary" id="saveRoleBtn"><i class="fas fa-save"></i> 保存分配</button>
            </div>
        </div>
    </div>
</div>

<!-- 轻提示 -->
<div id="toastMessage" class="toast-tip"><i class="fas fa-check-circle" style="color:#4ade80;"></i> <span id="toastText">操作成功</span></div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script>
    // ==================== 全局配置 ====================
    const API_BASE = '/api-user/';                // 用户接口
    const SYS_RULE_API = '/sys_rule/';            // 角色表接口 (返回 role_id, role_name, description)
    const USER_ROLE_API = '/sys_user_role/';       // 用户角色关联表接口 (id, user_id, role_id)

    let currentPage = 1;
    let pageSize = 10;
    let totalCount = 0;
    let totalPages = 1;
    let currentOrdering = '';
    let currentSearch = '';

    // 存储当前正在分配角色的用户ID 和 用户名
    let currentRoleUserId = null;
    let currentRoleUserName = '';

    // 存储从 sys_rule 加载的角色列表
    let globalRoleList = [];

    $(document).ready(function() {
        loadUsers();

        // 搜索 & 排序
        $('#searchBtn').on('click', function() {
            currentSearch = $('#searchInput').val();
            currentPage = 1;
            loadUsers();
        });
        $('#orderingSelect').on('change', function() {
            currentOrdering = $(this).val();
            currentPage = 1;
            loadUsers();
        });

        // 新增用户
        $('#addUserBtn').on('click', function() {
            openUserModal('add');
        });

        // 关闭用户模态框
        $('#closeModalBtn, #cancelModalBtn').on('click', function() {
            $('#userModal').removeClass('show');
        });

        // 提交用户表单 (新增/编辑)
        $('#userForm').on('submit', function(e) {
            e.preventDefault();
            const id = $('#userId').val();
            const userData = {
                user_name: $('#userName').val(),
                pid: $('#pid').val(),
                email: $('#email').val(),
                mobile: $('#mobile').val(),
                address: $('#address').val(),
            };
            const pwd = $('#password').val();
            if (pwd.trim() !== '') userData.password = pwd;

            if (id) {
                $.ajax({
                    url: API_BASE + id + '/',
                    method: 'PATCH',
                    contentType: 'application/json',
                    data: JSON.stringify(userData),
                    success: function() { showToast('用户更新成功'); closeUserModal(); loadUsers(); },
                    error: handleAjaxError
                });
            } else {
                $.ajax({
                    url: API_BASE,
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(userData),
                    success: function() { showToast('用户创建成功'); closeUserModal(); loadUsers(); },
                    error: handleAjaxError
                });
            }
        });

        // 角色对话框相关 ===================================
        $('#closeRoleModalBtn, #cancelRoleBtn').on('click', function() {
            $('#roleModal').removeClass('show');
        });

        // 点击保存分配角色: 向 sys_user_role 插入记录 (这里演示选择单个角色, 可根据需要扩展多选)
        $('#saveRoleBtn').on('click', function() {
            const selectedRoleId = $('input[name="roleRadio"]:checked').val();
            if (!selectedRoleId) {
                showToast('请选择一个角色', 'warn');
                return;
            }
            if (!currentRoleUserId) {
                showToast('用户信息丢失', 'error');
                return;
            }

            // 准备数据 插入 sys_user_role (id 自增，由后端生成)
            const postData = {
                user_id: currentRoleUserId,
                role_id: parseInt(selectedRoleId)
            };

            $.ajax({
                url: USER_ROLE_API,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(postData),
                success: function(resp) {
                    showToast('角色分配成功');
                    $('#roleModal').removeClass('show');
                    // 可选刷新用户列表或更新显示
                    loadUsers(); 
                },
                error: function(xhr) {
                    let msg = '分配失败';
                    if (xhr.responseJSON && xhr.responseJSON.detail) msg = xhr.responseJSON.detail;
                    else if (xhr.status === 400) msg = '可能重复分配或数据错误';
                    showToast(msg, 'error');
                }
            });
        });

        // 分页
        $('#prevPage').on('click', function() {
            if (currentPage > 1) { currentPage--; loadUsers(); }
        });
        $('#nextPage').on('click', function() {
            if (currentPage < totalPages) { currentPage++; loadUsers(); }
        });
    });

    // ========== 用户表加载 ==========
    function loadUsers() {
        let params = { page: currentPage };
        if (currentSearch) params.search = currentSearch;
        if (currentOrdering) params.ordering = currentOrdering;

        $('#tableBody').html(`<tr class="empty-row"><td colspan="8"><i class="fas fa-spinner fa-pulse"></i> 加载中...</td></tr>`);
        $.ajax({
            url: API_BASE,
            method: 'GET',
            data: params,
            success: function(response) {
                renderUserTable(response);
                updatePagination(response);
            },
            error: function() {
                $('#tableBody').html(`<tr class="empty-row"><td colspan="8">加载失败，请检查API</td></tr>`);
            }
        });
    }

    function renderUserTable(data) {
        const results = data.results || [];
        totalCount = data.count || 0;
        if (results.length === 0) {
            $('#tableBody').html(`<tr class="empty-row"><td colspan="8"><i class="fas fa-user-slash"></i> 没有用户</td></tr>`);
            return;
        }
        let rows = '';
        results.forEach(u => {
            const create = u.create_time ? new Date(u.create_time).toLocaleString('zh-CN', {hour12: false}) : '-';
            // 角色占位, 可显示简标
            rows += `<tr>
                <td><span class="badge">#${u.user_id}</span></td>
                <td><strong>${escapeHtml(u.user_name || '')}</strong></td>
                <td>${escapeHtml(u.pid || '-')}</td>
                <td>${escapeHtml(u.email || '-')}</td>
                <td>${escapeHtml(u.mobile || '-')}</td>
                <td>${escapeHtml(u.address || '-')}</td>
                <td><button class="role-badge-btn assign-role" data-userid="${u.user_id}" data-username="${escapeHtml(u.user_name)}"><i class="fas fa-user-tag"></i> 分配角色</button></td>
                <td>
                    <div class="action-group">
                        <button class="btn-icon edit-user" data-id="${u.user_id}"><i class="fas fa-edit"></i></button>
                        <button class="btn-icon danger delete-user" data-id="${u.user_id}"><i class="fas fa-trash"></i></button>
                    </div>
                </td>
            </tr>`;
        });
        $('#tableBody').html(rows);

        // 绑定编辑/删除/分配角色
        $('.edit-user').on('click', function() { editUser($(this).data('id')); });
        $('.delete-user').on('click', function() { deleteUser($(this).data('id')); });
        $('.assign-role').on('click', function() {
            const userId = $(this).data('userid');
            const userName = $(this).data('username') || `ID:${userId}`;
            openRoleModal(userId, userName);
        });
    }

    // 打开分配角色对话框: 获取 sys_rule 列表
    function openRoleModal(userId, userName) {
        currentRoleUserId = userId;
        currentRoleUserName = userName;
        $('#roleModalUserName').html(`为用户 <span style="background:#e2ecfe; padding:0.2rem 1rem; border-radius:30px;">${escapeHtml(userName)} (ID:${userId})</span> 选择角色`);

        // 加载角色列表
        $('#roleListContainer').html(`<div style="text-align: center; padding: 2rem;"><i class="fas fa-spinner fa-pulse"></i> 加载角色列表...</div>`);
        $('#selectedRoleHint').html('<i class="fas fa-info-circle"></i> 未选择角色');
        $('#roleModal').addClass('show');

        $.ajax({
            url: SYS_RULE_API,
            method: 'GET',
            success: function(roleData) {
                // 假设 roleData 是数组或者 {results: [...]} 根据实际分页调整
                let roles = [];
                if (Array.isArray(roleData)) roles = roleData;
                else if (roleData.results) roles = roleData.results;
                globalRoleList = roles;

                if (roles.length === 0) {
                    $('#roleListContainer').html(`<div style="padding: 2rem; text-align:center; color:#64748b;">暂无角色数据</div>`);
                    return;
                }

                let htmlStr = '';
                roles.forEach(r => {
                    const roleId = r.role_id || r.id;  // 兼容字段
                    const roleName = r.role_name || r.name || '未命名';
                    const desc = r.description || '暂无描述';
                    htmlStr += `
                        <div class="role-item" data-roleid="${roleId}">
                            <input class="role-radio" type="radio" name="roleRadio" value="${roleId}" id="role_${roleId}">
                            <div class="role-info">
                                <label for="role_${roleId}" style="cursor: pointer; display: block;">
                                    <span class="role-name">${escapeHtml(roleName)}</span>
                                    <div class="role-desc">${escapeHtml(desc)}</div>
                                </label>
                            </div>
                        </div>
                    `;
                });
                $('#roleListContainer').html(htmlStr);

                // 点击整个item也可选中radio
                $('.role-item').on('click', function(e) {
                    if (e.target.type !== 'radio') {
                        $(this).find('.role-radio').prop('checked', true).trigger('change');
                    }
                });
                $('input[name="roleRadio"]').on('change', function() {
                    const selectedId = $('input[name="roleRadio"]:checked').val();
                    const role = roles.find(r => (r.role_id == selectedId || r.id == selectedId));
                    if (role) {
                        $('#selectedRoleHint').html(`<i class="fas fa-check-circle" style="color:#2563eb;"></i> 已选: ${escapeHtml(role.role_name || role.name)}`);
                    } else {
                        $('#selectedRoleHint').html('<i class="fas fa-info-circle"></i> 已选择');
                    }
                });
            },
            error: function() {
                $('#roleListContainer').html(`<div style="color:#b91c1c; padding:2rem; text-align:center;">加载角色失败，请检查 sys_rule 接口</div>`);
            }
        });
    }

    // 编辑用户 (获取单条)
    function editUser(id) {
        $.ajax({
            url: API_BASE + id + '/',
            method: 'GET',
            success: function(user) { openUserModal('edit', user); },
            error: handleAjaxError
        });
    }

    function deleteUser(id) {
        if (!confirm('确认删除用户？')) return;
        $.ajax({
            url: API_BASE + id + '/',
            method: 'DELETE',
            success: function() {
                showToast('用户已删除');
                if (totalCount > 1 && (totalCount-1) <= (currentPage-1)*pageSize) currentPage = Math.max(1, currentPage-1);
                loadUsers();
            },
            error: handleAjaxError
        });
    }

    function openUserModal(action, userData) {
        $('#userForm')[0].reset(); $('#userId').val('');
        if (action === 'edit' && userData) {
            $('#modalTitle').text('编辑用户');
            $('#userId').val(userData.user_id);
            $('#userName').val(userData.user_name || '');
            $('#pid').val(userData.pid || '');
            $('#email').val(userData.email || '');
            $('#mobile').val(userData.mobile || '');
            $('#address').val(userData.address || '');
        } else {
            $('#modalTitle').text('新增用户');
        }
        $('#userModal').addClass('show');
    }

    function closeUserModal() { $('#userModal').removeClass('show'); }

    function updatePagination(data) {
        totalPages = Math.ceil(totalCount / pageSize) || 1;
        $('#pageInfo').text(`共 ${totalCount} 条 · 第 ${currentPage}/${totalPages} 页`);
        let pHtml = '';
        let start = Math.max(1, currentPage-2), end = Math.min(totalPages, start+4);
        if (end - start < 4) start = Math.max(1, end-4);
        for (let i=start; i<=end; i++) {
            pHtml += `<button class="page-btn ${i===currentPage?'active':''}" data-page="${i}">${i}</button>`;
        }
        $('#pageNumbers').html(pHtml);
        $('.page-btn[data-page]').off().on('click', function() { currentPage = $(this).data('page'); loadUsers(); });
        $('#prevPage').prop('disabled', !data.previous);
        $('#nextPage').prop('disabled', !data.next);
    }

    function escapeHtml(unsafe) {
        if (!unsafe) return unsafe;
        return unsafe.replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;';
            return m;
        });
    }

    function handleAjaxError(xhr) {
        let msg = '操作失败';
        if (xhr.responseJSON && xhr.responseJSON.detail) msg = xhr.responseJSON.detail;
        else if (xhr.responseText) msg = xhr.responseText;
        showToast(msg, 'error');
    }

    function showToast(text, type = 'success') {
        $('#toastText').text(text);
        $('#toastMessage').fadeIn(200).addClass('show');
        setTimeout(() => $('#toastMessage').fadeOut(200), 2600);
    }
</script>
<!-- 
    后端接口约定:
    - sys_rule/ 返回字段包含 role_id, role_name, description (支持数组或分页格式)
    - sys_user_role/ POST 接收 { user_id, role_id } 插入关联表
    Django 需配置对应路由与视图。
-->
</body>
